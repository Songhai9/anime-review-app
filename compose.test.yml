name: mangas-test

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mangas_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mangas_test"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    tmpfs:
      - /var/lib/postgresql/data

  tests:
    build:
      context: .
      target: test
    environment:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@db:5432/mangas_test
      DATABASE_SSL: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./sql:/app/sql:ro
    command: npm run test:integration
