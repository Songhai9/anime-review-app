name: CI Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint


  unit-tests:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit


  integration-tests:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: medias_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d medias_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: medias_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: test_password
      PGPASSWORD: test_password
      TEST_DATABASE_URL: postgresql://postgres:test_password@localhost:5432/medias_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Initialize database schema
        run: |
          psql \
            -h "$DATABASE_HOST" \
            -U "$DATABASE_USER" \
            -p "$DATABASE_PORT" \
            -d "$DATABASE_NAME" \
            -f sql/schema.sql

      - name: Run integration tests
        run: npm run test:integration


  coverage:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: medias_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d medias_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: medias_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: test_password
      PGPASSWORD: test_password
      TEST_DATABASE_URL: postgresql://postgres:test_password@localhost:5432/medias_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Initialize database schema
        run: |
          psql \
            -h "$DATABASE_HOST" \
            -U "$DATABASE_USER" \
            -p "$DATABASE_PORT" \
            -d "$DATABASE_NAME" \
            -f sql/schema.sql

      - name: Run coverage
        run: npm run test:coverage


  build:
    runs-on: ubuntu-latest

    needs:
      - unit-tests
      - integration-tests
      - coverage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
          | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Define image name and tag
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$(echo '${{ github.sha }}' | cut -c1-8)" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: docker build -t "$IMAGE_NAME:$IMAGE_TAG" .

      - name: Push Docker image
        run: docker push "$IMAGE_NAME:$IMAGE_TAG"