name: App CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint


  unit-tests:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run test:unit


  integration-tests:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: medias_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d medias_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: medias_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: test_password
      PGPASSWORD: test_password
      TEST_DATABASE_URL: postgresql://postgres:test_password@localhost:5432/medias_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Initialize database
        run: |
          psql \
            -h "$DATABASE_HOST" \
            -U "$DATABASE_USER" \
            -p "$DATABASE_PORT" \
            -d "$DATABASE_NAME" \
            -f sql/schema.sql

      - run: npm run test:integration


  coverage:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: medias_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d medias_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: medias_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: test_password
      PGPASSWORD: test_password
      TEST_DATABASE_URL: postgresql://postgres:test_password@localhost:5432/medias_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Initialize database
        run: |
          psql \
            -h "$DATABASE_HOST" \
            -U "$DATABASE_USER" \
            -p "$DATABASE_PORT" \
            -d "$DATABASE_NAME" \
            -f sql/schema.sql

      - run: npm run test:coverage


  build:
    runs-on: ubuntu-latest

    needs:
      - unit-tests
      - integration-tests
      - coverage

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      backend_repository: ${{ steps.vars.outputs.backend_repository }}
      frontend_repository: ${{ steps.vars.outputs.frontend_repository }}

    steps:
      - uses: actions/checkout@v7

      - name: Define image names
        id: vars
        shell: bash
        run: |
          OWNER_LC=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')

          echo "image_tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

          echo \
            "backend_repository=ghcr.io/${OWNER_LC}/anime-review-backend" \
            >> "$GITHUB_OUTPUT"

          echo \
            "frontend_repository=ghcr.io/${OWNER_LC}/anime-review-frontend" \
            >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api-runtime
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.vars.outputs.backend_repository }}:${{ steps.vars.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          target: frontend-runtime
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.vars.outputs.frontend_repository }}:${{ steps.vars.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}


  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions: {}

    env:
      K8S_WORKFLOW_TOKEN: ${{ secrets.K8S_WORKFLOW_TOKEN }}

    steps:
      - name: Trigger Kubernetes workflow
        shell: bash
        run: |
          set -euo pipefail

          PAYLOAD=$(jq -n \
            --arg image_tag "${{ needs.build.outputs.image_tag }}" \
            --arg backend_repository "${{ needs.build.outputs.backend_repository }}" \
            --arg frontend_repository "${{ needs.build.outputs.frontend_repository }}" \
            '{
              ref: "main",
              inputs: {
                image_tag: $image_tag,
                backend_repository: $backend_repository,
                frontend_repository: $frontend_repository,
                bootstrap_cluster: "false"
              }
            }')

          RESPONSE=$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${K8S_WORKFLOW_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/Songhai9/anime-review-k8s/actions/workflows/deploy.yml/dispatches \
            -d "$PAYLOAD")

          echo "$RESPONSE"

          RUN_ID=$(echo "$RESPONSE" | jq -r '.workflow_run_id // empty')

          if [[ -z "$RUN_ID" ]]; then
            echo "Unable to retrieve downstream workflow run ID"
            exit 1
          fi

          echo "Kubernetes workflow run: $RUN_ID"

          while true; do

            RUN=$(curl \
              --fail-with-body \
              --silent \
              --show-error \
              -L \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${K8S_WORKFLOW_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/Songhai9/anime-review-k8s/actions/runs/${RUN_ID}")

            STATUS=$(echo "$RUN" | jq -r '.status')
            CONCLUSION=$(echo "$RUN" | jq -r '.conclusion // empty')

            echo "Kubernetes workflow: $STATUS ${CONCLUSION}"

            if [[ "$STATUS" == "completed" ]]; then

              if [[ "$CONCLUSION" != "success" ]]; then
                echo "Kubernetes deployment failed"
                exit 1
              fi

              break
            fi

            sleep 10
          done